# WitchSpring R on the upstream port (seedds/nxnative): product -> host -> headless boot, all on a cloud Mac.
# Game files live in a PRIVATE repo (littckerQiu/witchspringr-data); the public code repo only holds the profile,
# the cut and this workflow.
name: NX bring-up
on:
  workflow_dispatch:
    inputs:
      watch:
        description: 'DM_WATCH seconds (0 = until it exits)'
        default: '25'
permissions:
  contents: read
env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  DM_GAME: '010018401EEA8000'
jobs:
  boot:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Python deps (rewriter, shader tools)
        run: |
          set -euo pipefail
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet lz4 capstone numpy pillow
          /tmp/venv/bin/python -c "import lz4, capstone, numpy; print('deps ok')"
      - name: Upstream source
        run: git clone --depth 1 https://github.com/seedds/nxnative /tmp/nx
      - name: Profile + node-area cut
        run: /tmp/venv/bin/python nxnative-add/apply.py /tmp/nx
      - name: Game files (private data repo)
        env:
          GH_TOKEN: ${{ secrets.DATA_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/data
          gh release download data --repo littckerQiu/witchspringr-data --pattern exefs.zip --dir /tmp/data
          unzip -q /tmp/data/exefs.zip -d /tmp/data
          ls /tmp/data/ExeFS
      - name: Product (rewritten modules)
        run: |
          set -euo pipefail
          mkdir -p /tmp/prod
          for m in main sdk subsdk0; do
            echo "=== $m"
            /tmp/venv/bin/python /tmp/nx/dm/tools/patch_nso.py /tmp/data/ExeFS/$m /tmp/prod $m 2>&1 | tail -2
          done
      - name: Chain header
        run: |
          set -euo pipefail
          cd /tmp/nx
          /tmp/venv/bin/python dm/gfx/tools/dmsh_chain.py --header 2>&1 | tail -3 || true
          ls dm/games/$DM_GAME
      - name: Profile check (never fails the job)
        run: |
          cd /tmp/nx || exit 0
          for k in sys_resource app_pool mem_reserve mem_alias mem_stack mem_used modules; do
            printf '%-14s ' "$k"; python3 dm/games/game.py 010018401EEA8000 $k 2>&1 | head -1
          done
          python3 dm/games/game.py header 010018401EEA8000 /tmp/prof.h >/dev/null 2>&1 || true
          grep -a "SYS_RESOURCE\|APP_POOL\|MEM_ALIAS\|MEM_RESERVE\|MEM_STACK" /tmp/prof.h 2>/dev/null | head
      - name: Host
        run: |
          set -euo pipefail
          make -C /tmp/nx/dm/host GAME=$DM_GAME dmhost -j4 2>&1 | tail -6
      - name: Headless boot
        run: |
          set -uo pipefail
          mkdir -p /tmp/romfs /tmp/work/save /tmp/work/temp
          : > /tmp/empty_map.tsv
          DM_ROOT=/tmp/work DM_ROMFS=/tmp/romfs DM_SAVE=/tmp/work/save DM_TEMP=/tmp/work/temp \
          DM_NVN_SHMAP=/tmp/empty_map.tsv DM_WATCH="${{ inputs.watch }}" DM_SVC=1 DM_FS=1 \
            /tmp/nx/dm/host/dmhost /tmp/prod > /tmp/work/boot.log 2>&1 || true   # DM_WATCH ends it
          echo "---- first 40 lines"; head -40 /tmp/work/boot.log
          echo "---- last 60 lines"; tail -60 /tmp/work/boot.log
          echo "---- red lines"; grep -aF '[RED]' /tmp/work/boot.log | sort | uniq -c | head -20 || true
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-log
          path: /tmp/work/**
          if-no-files-found: warn
          retention-days: 7
