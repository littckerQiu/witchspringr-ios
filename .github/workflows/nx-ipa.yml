# WitchSpring R on the upstream port: shader tables -> iOS metallibs -> unsigned IPA, on a cloud Mac.
name: NX IPA
on:
  workflow_dispatch:
    inputs:
      jobs:
        description: 'parallel shader build jobs'
        default: '6'
permissions:
  contents: read
env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  DM_GAME: '010018401EEA8000'
jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Toolchain (dotnet, xcodegen, spirv-cross 1.4.357.0)
        run: |
          set -euo pipefail
          brew install dotnet xcodegen >/dev/null
          export DOTNET_ROOT=$(brew --prefix dotnet)/libexec
          "$DOTNET_ROOT/dotnet" --list-runtimes | head -3
          git clone -q --branch vulkan-sdk-1.4.357.0 --depth 1 https://github.com/KhronosGroup/SPIRV-Cross /tmp/spvc
          cmake -S /tmp/spvc -B /tmp/spvc/b -G Ninja -DCMAKE_BUILD_TYPE=Release -DSPIRV_CROSS_ENABLE_TESTS=OFF >/dev/null
          cmake --build /tmp/spvc/b --target spirv-cross -j8 >/dev/null
          echo "/tmp/spvc/b" >> $GITHUB_PATH
          /tmp/spvc/b/spirv-cross --help 2>&1 | head -2
      - name: Python deps
        run: |
          set -euo pipefail
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet lz4 capstone numpy pillow
      - name: Upstream + profile + patches
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/seedds/nxnative /tmp/nx
          /tmp/venv/bin/python nxnative-add/apply.py /tmp/nx
      - name: Game files
        env:
          GH_TOKEN: ${{ secrets.DATA_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/data /tmp/romfs /tmp/romfsd
          gh release download data --repo littckerQiu/witchspringr-data --pattern exefs.zip --dir /tmp/data
          unzip -q /tmp/data/exefs.zip -d /tmp/data
          gh release download data --repo littckerQiu/witchspringr-data --pattern 'romfs-*.zip' --dir /tmp/romfsd
          for z in /tmp/romfsd/*.zip; do unzip -qo "$z" -d /tmp/romfs; done
          echo "romfs files: $(find /tmp/romfs -type f | wc -l)"; ls /tmp/romfs
      - name: Product (rewritten modules)
        run: |
          set -euo pipefail
          mkdir -p /tmp/prod
          for m in main sdk subsdk0; do /tmp/venv/bin/python /tmp/nx/dm/tools/patch_nso.py /tmp/data/ExeFS/$m /tmp/prod $m 2>&1 | tail -1; done
      - name: Shader tables (shader_split)
        run: |
          set -euo pipefail
          cd /tmp/nx
          GD=dm/games/$DM_GAME
          /tmp/venv/bin/python dm/gfx/tools/shader_split.py /tmp/romfs /tmp/data/ExeFS/main /tmp/pkg \
            $GD/shader_map.tsv $GD/shader_facts.tsv $GD/shader_pairs.tsv 2>&1 | tail -25
          wc -l $GD/shader_map.tsv $GD/shader_facts.tsv $GD/shader_pairs.tsv
          ls /tmp/pkg | head
      - name: Chain header (re-lock the tools the runner actually has)
        env:
          DOTNET_ROOT: /opt/homebrew/opt/dotnet/libexec
        run: |
          set -uo pipefail
          cd /tmp/nx
          export PATH="/tmp/spvc/b:$PATH"
          /tmp/venv/bin/python dm/gfx/tools/dmsh_chain.py --update-lock 2>&1 | tail -6 || true
          /tmp/venv/bin/python dm/gfx/tools/dmsh_chain.py --header 2>&1 | tail -3
          cat dm/games/$DM_GAME/dmsh_chain.h
      - name: Shader caches (so a re-run does not rebuild 44k shaders)
        uses: actions/cache@v4
        with:
          path: |
            /tmp/msl
            /tmp/msl_ios
          key: wsr-shaders-${{ github.run_id }}
          restore-keys: wsr-shaders-
      - name: iOS shader libraries (dmsh_build)
        env:
          DOTNET_ROOT: /opt/homebrew/opt/dotnet/libexec
          J: ${{ inputs.jobs }}
        run: |
          set +e                                   # dmsh_build exits non-zero for a single failed shader; one is expected
          cd /tmp/nx
          export PATH="/tmp/spvc/b:$PATH"
          export IOSOUT=/tmp/msl_ios
          IOSOUT=/tmp/msl_ios /tmp/venv/bin/python dm/gfx/tools/dmsh_build.py /tmp/pkg /tmp/msl 2>&1 | tail -30
          n=$(ls /tmp/msl_ios/b-* 2>/dev/null | grep -c "_b.metallib$")
          echo "metallibs: $n"
          [ "$n" -gt 1000 ] || { echo "[red] too few metallibs"; exit 1; }
          exit 0
      - name: IPA
        env:
          DM_DISPLAY_NAME: 'WitchSpring R'
          DM_APP_VERSION: '1.0'
        run: |
          set -uo pipefail
          mkdir -p /tmp/w/data/v0 /tmp/w/build
          ln -sfn /tmp/romfs /tmp/w/data/v0/RomFS
          ln -sfn /tmp/prod /tmp/w/build/patched_v0
          mkdir -p /tmp/w/data/v0 && touch /tmp/w/data/v0/.keep
          cd /tmp/nx
          W=/tmp/w GAME=$DM_GAME PATCHED=/tmp/prod ROMFS=/tmp/romfs MSL_IOS=/tmp/msl_ios AOC= \
            bash dm/ios/tools/build_ipa.sh /tmp/WitchSpringR.ipa 2>&1 | tail -30 || true
          ls -l /tmp/WitchSpringR.ipa 2>/dev/null || echo "no ipa"
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nx-ipa
          path: |
            /tmp/WitchSpringR.ipa
            /tmp/nx/dm/games/010018401EEA8000/*.tsv
            /tmp/nx/dm/games/010018401EEA8000/dmsh_chain.h
          if-no-files-found: warn
          retention-days: 7
