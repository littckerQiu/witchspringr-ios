# WitchSpring R on the upstream port: shader tables -> iOS metallibs -> unsigned IPA, on a cloud Mac.
name: NX IPA
on:
  workflow_dispatch:
    inputs:
      jobs:
        description: 'parallel shader build jobs'
        default: '6'
permissions:
  contents: read
env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  DM_GAME: '010018401EEA8000'
jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Toolchain (dotnet, xcodegen, spirv-cross 1.4.357.0)
        run: |
          set -euo pipefail
          brew install dotnet xcodegen >/dev/null
          export DOTNET_ROOT=$(brew --prefix dotnet)/libexec
          "$DOTNET_ROOT/dotnet" --list-runtimes | head -3
          git clone -q --branch vulkan-sdk-1.4.357.0 --depth 1 https://github.com/KhronosGroup/SPIRV-Cross /tmp/spvc
          cmake -S /tmp/spvc -B /tmp/spvc/b -G Ninja -DCMAKE_BUILD_TYPE=Release -DSPIRV_CROSS_ENABLE_TESTS=OFF >/dev/null
          cmake --build /tmp/spvc/b --target spirv-cross -j8 >/dev/null
          echo "/tmp/spvc/b" >> $GITHUB_PATH
          /tmp/spvc/b/spirv-cross --help 2>&1 | head -2
      - name: Python deps
        run: |
          set -euo pipefail
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet lz4 capstone numpy pillow fonttools
      - name: Upstream + profile + patches
        env:
          # Pinned: our patches (CUTS entry, residency fallback, BC decode, romfs search) are written against this snapshot.
          # Upstream split patch_nso.py into per-build patch files on 2026-10-23 15:36Z, which moved the CUTS table.
          UPSTREAM_SHA: f73c1e3ec65c4426996e313dbcfffbcf0760be7b
        run: |
          set -euo pipefail
          git init -q /tmp/nx
          cd /tmp/nx
          git remote add origin https://github.com/seedds/nxnative
          git fetch -q --depth 1 origin $UPSTREAM_SHA
          git checkout -q FETCH_HEAD
          echo "upstream $(git rev-parse HEAD)"
          cd "$GITHUB_WORKSPACE"
          /tmp/venv/bin/python nxnative-add/apply.py /tmp/nx
      - name: Game files
        env:
          GH_TOKEN: ${{ secrets.DATA_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/data /tmp/romfs /tmp/romfsd
          gh release download data --repo littckerQiu/witchspringr-data --pattern exefs.zip --dir /tmp/data
          unzip -q /tmp/data/exefs.zip -d /tmp/data
          gh release download data --repo littckerQiu/witchspringr-data --pattern 'romfs-*.zip' --dir /tmp/romfsd
          for z in /tmp/romfsd/*.zip; do unzip -qo "$z" -d /tmp/romfs; done
          echo "romfs files: $(find /tmp/romfs -type f | wc -l)"; ls /tmp/romfs
      - name: Product (rewritten modules)
        run: |
          set -euo pipefail
          mkdir -p /tmp/prod
          for m in main sdk subsdk0; do /tmp/venv/bin/python /tmp/nx/dm/tools/patch_nso.py /tmp/data/ExeFS/$m /tmp/prod $m 2>&1 | tail -1; done
      - name: Full shader set (scanned from the complete RomFS off-device)
        env:
          GH_TOKEN: ${{ secrets.DATA_TOKEN }}
        run: |
          set -euo pipefail
          gh release download data --repo littckerQiu/witchspringr-data --pattern shaders-full.zip --dir /tmp/sf
          unzip -q /tmp/sf/shaders-full.zip -d /tmp/sf/x
          rm -rf /tmp/pkg && mv /tmp/sf/x/pkg /tmp/pkg
          GD=/tmp/nx/dm/games/$DM_GAME
          cp /tmp/sf/x/tables/shader_map.tsv /tmp/sf/x/tables/shader_facts.tsv /tmp/sf/x/tables/shader_pairs.tsv $GD/
          wc -l $GD/shader_map.tsv $GD/shader_pairs.tsv
          ls /tmp/pkg
      - name: Shader tables
        run: |
          set -euo pipefail
          cd /tmp/nx
          GD=dm/games/$DM_GAME
          test -s $GD/shader_map.tsv || { echo "[red] no shader map"; exit 1; }
          test -d /tmp/pkg && ls /tmp/pkg | head
      - name: Chain header (re-lock the tools the runner actually has)
        env:
          DOTNET_ROOT: /opt/homebrew/opt/dotnet/libexec
        run: |
          set -uo pipefail
          cd /tmp/nx
          export PATH="/tmp/spvc/b:$PATH"
          /tmp/venv/bin/python dm/gfx/tools/dmsh_chain.py --update-lock 2>&1 | tail -6 || true
          /tmp/venv/bin/python dm/gfx/tools/dmsh_chain.py --header 2>&1 | tail -3
          cat dm/games/$DM_GAME/dmsh_chain.h
      # The shader cache grew to 8.7 GB (mac + iOS metallibs), and restoring it over a slow link costs more than
      # compiling: 58k shaders take about 40-60 min of CPU on 8 cores, with no download at all. Re-enable if the
      # cache is trimmed to the iOS set only.
      - name: Shader caches (disabled, a full rebuild is faster than the 8.7 GB restore)
        run: echo "compiling every shader; no cache restore"
      - name: Prefill the Metal compile cache (from the last build's archive, if any)
        env:
          GH_TOKEN: ${{ secrets.DATA_TOKEN }}
        run: |
          set +e
          mkdir -p /tmp/pf
          gh release download data --repo littckerQiu/witchspringr-data --pattern 'shaders-cache-*.zip' --dir /tmp/pf || { echo "no prefill archive yet"; exit 0; }
          mkdir -p /tmp/pf/mac /tmp/pf/ios
          for z in /tmp/pf/shaders-cache-mac.zip /tmp/pf/shaders-cache-ios.zip; do [ -f "$z" ] && unzip -qo "$z" -d /tmp/pf/$(basename "$z" | sed 's/shaders-cache-\(.*\)\.zip/\1/'); done
          du -sm /tmp/pf/mac /tmp/pf/ios
          echo "DMSH_PREFILL=/tmp/pf/mac=/tmp/pf/ios" >> $GITHUB_ENV
          echo "prefill enabled"
          exit 0
      - name: iOS shader libraries (dmsh_build)
        env:
          DOTNET_ROOT: /opt/homebrew/opt/dotnet/libexec
          J: ${{ inputs.jobs }}
        run: |
          set +e                                   # dmsh_build exits non-zero for a single failed shader; one is expected
          cd /tmp/nx
          export PATH="/tmp/spvc/b:$PATH"
          export IOSOUT=/tmp/msl_ios
          IOSOUT=/tmp/msl_ios /tmp/venv/bin/python dm/gfx/tools/dmsh_build.py /tmp/pkg /tmp/msl 2>&1 | tail -30
          n=$(ls /tmp/msl_ios/b-* 2>/dev/null | grep -c "_b.metallib$")
          echo "metallibs: $n"
          [ "$n" -gt 1000 ] || { echo "[red] too few metallibs"; exit 1; }
          exit 0
      - name: Shader auxiliary tables (c1 sizes, uniform extents)
        run: |
          set +e
          cd /tmp/nx
          export PATH="/tmp/spvc/b:$PATH"
          export DOTNET_ROOT=/opt/homebrew/opt/dotnet/libexec
          /tmp/venv/bin/python dm/gfx/tools/c1_guard.py 2>&1 | tail -4
          /tmp/venv/bin/python dm/gfx/tools/cb_extent.py 2>&1 | tail -4
          cd dm/games/$DM_GAME && wc -l c1_full.tsv cb_extent.tsv 2>/dev/null
          exit 0
      - name: Archive the Metal libraries for the next build
        if: always()
        env:
          GH_TOKEN: ${{ secrets.DATA_TOKEN }}
        run: |
          set +e
          V=$(sed -n 's/^#define DMSH_CHAIN "\(.*\)"/\1/p' /tmp/nx/dm/games/$DM_GAME/dmsh_chain.h)
          [ -n "$V" ] || { echo "no chain version"; exit 0; }
          [ -d /tmp/msl/b-$V ] || { echo "no mac libraries"; exit 0; }
          # Zip each side as it stands (zip takes a directory, so no 58k-name argument list and no tar pattern matching).
          ( cd /tmp/msl && zip -qr -1 /tmp/shaders-cache-mac.zip b-$V ) && ls -l /tmp/shaders-cache-mac.zip
          ( cd /tmp/msl_ios && zip -qr -1 /tmp/shaders-cache-ios.zip b-$V ) && ls -l /tmp/shaders-cache-ios.zip
          for n in mac ios; do
            OLD=$(gh api repos/littckerQiu/witchspringr-data/releases/420393850/assets --jq ".[]|select(.name==\"shaders-cache-$n.zip\")|.id")
            [ -n "$OLD" ] && gh api -X DELETE repos/littckerQiu/witchspringr-data/releases/assets/$OLD
            gh release upload data /tmp/shaders-cache-$n.zip --repo littckerQiu/witchspringr-data --clobber || echo "upload $n failed"
          done
          echo done
      - name: IPA
        env:
          FONT_PY: /tmp/venv/bin/python
          DM_DISPLAY_NAME: 'WitchSpring R'
          DM_APP_VERSION: '1.0'
        run: |
          set -uo pipefail
          mkdir -p /tmp/w/data/v0 /tmp/w/build
          # The app plays from Documents/romfs (the full dump the player copies with the Files app), so the copy packed into
          # the app is dead weight: 1.58 GiB of the 2.29 GiB IPA. Pack only the marker directory instead; the app then says
          # "game files not found" when nothing is in Documents rather than half-running from a partial set.
          mkdir -p /tmp/romfs_min/Data
          ln -sfn /tmp/romfs_min /tmp/w/data/v0/RomFS
          ln -sfn /tmp/prod /tmp/w/build/patched_v0
          mkdir -p /tmp/w/data/v0 && touch /tmp/w/data/v0/.keep
          cd /tmp/nx
          # Bake the stall watchdog in: the host writes a full thread dump when the frame loop stops for 8 s, so a hang
          # explains itself without the player having to create Documents/env.txt first.
          printf 'DM_WATCH_STALL=8\n' > /tmp/baked.env
          W=/tmp/w GAME=$DM_GAME PATCHED=/tmp/prod ROMFS=/tmp/romfs_min MSL_IOS=/tmp/msl_ios AOC= DM_ENV_FILE=/tmp/baked.env \
            bash dm/ios/tools/build_ipa.sh /tmp/WitchSpringR.ipa 2>&1 | tail -30 || true
          ls -l /tmp/WitchSpringR.ipa 2>/dev/null || echo "no ipa"
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nx-ipa
          path: |
            /tmp/WitchSpringR.ipa
            /tmp/nx/dm/games/010018401EEA8000/*.tsv
            /tmp/nx/dm/games/010018401EEA8000/dmsh_chain.h
          if-no-files-found: warn
          retention-days: 7
