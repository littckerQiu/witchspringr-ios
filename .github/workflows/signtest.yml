name: SIGNTEST
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: sign
        env:
          SIGN_P12: ${{ secrets.SIGN_P12 }}
          SIGN_PROFILE: ${{ secrets.SIGN_PROFILE }}
          SIGN_PASSWORD: ${{ secrets.SIGN_PASSWORD }}
          SIGN_BUNDLE_ID: ${{ secrets.SIGN_BUNDLE_ID }}
        run: echo "${#SIGN_PROFILE} ${#SIGN_PASSWORD} ${#SIGN_BUNDLE_ID}"
